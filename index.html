<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="contenedor">
        <header class="encabezado">
            <h1>Lista de Tareas</h1>
            <p>Organiza tu día, una tarea a la vez.</p>
        </header>

        <section class="tarjeta">
            <form id="formulario" class="formulario">
                <input type="text" id="inputTarea" aria-label="Nueva tarea" placeholder="Escribe una nueva tarea..." autocomplete="off" maxlength="80">
                <button type="submit" class="btn-agregar">Agregar</button>
            </form>

            <p class="contador">Tienes <span id="pendientes">0</span> tarea(s) pendiente(s)</p>

            <ul id="listaTareas" class="lista"></ul>

            <p id="mensajeVacio" class="mensaje-vacio">No hay tareas todavía.</p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
